[project]
name = "restaurant-api"
version = "0.1.0"
description = "REST API for a restaurant: menu, tables, reservations, orders"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
